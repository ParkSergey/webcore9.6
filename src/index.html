<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>WebCore9.</title>
  </head>
  <body>
    <header>
      <button class="burger-button"></button>
      <img src="img/Group.svg" alt="group" height="51px" />
      <img
        class="top-icons__search"
        src="img/divider.svg"
        alt="search"
        height="40px"
      />
      <img src="img/repair.svg" alt="repair" height="40px" />
      <img src="img/checkstatus.svg" alt="checkstatus" height="40px" />
    </header>
    <h1 class="main-title">
      <img
        class="stick"
        src="img/highlight.svg"
        alt="highlight"
        height="40px"
      />
      <span class="main-title__headline">Услуги и сервисы</span>
    </h1>
    <div class="menu">
      <button class="menu-first-button">Ремонтируемые бренды</button>
      <button>Ремонтируемые устройства</button>
      <button>Цены на услуги</button>
      <button>Адреса сервисных центров</button>
      <button>Специальные цены</button>
      <button>Отзывы</button>
    </div>
    <div class="first-paragraph">
      <p class="first-paragraph__text">
        Мы являемся авторизованным сервисным центром по ремонту техники Dell.
        Только у нас вы можете отремонтировать свой ноутбук Dell с официальной
        гарантией производителя
      </p>
      <div class="continuation">
        <img src="img/expand.svg" alt="expand" height="24px" />
        <strong class="continuation-title">Читать далее</strong>
      </div>
      <img class="main-picture" src="img/MG_3223.png" alt="logo company" />
    </div>
    <div class="description"
      >Ремонт техники различных<br />
      брендов</div
    >
    <div class="swiper">
      <!-- Additional required wrapper -->
      <div class="swiper-wrapper">
        <!-- Slides -->
        <div class="swiper-slide">
          <img class="logo" src="img/acer.svg" alt="acer" /><img
            src="img/go.svg"
            alt="go"
          />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/apple.svg" alt="apple" /><img
            src="img/go.svg"
            alt="go"
          />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/bosch.svg" alt="bosch" />
          <img src="img/go.svg" alt="go" />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/hp.svg" alt="hp" /><img
            src="img/go.svg"
            alt="go"
          />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/lenovo.svg" alt="lenovo" />
          <img src="img/go.svg" alt="go" />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/Samsun.svg" alt="samsung" />
          <img src="img/go.svg" alt="go" />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/acer.svg" alt="acer" />
          <img src="img/go.svg" alt="go" />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/apple.svg" alt="apple" />
          <img src="img/go.svg" alt="go" />
        </div>
        <div class="swiper-slide">
          <img class="logo" src="img/bosch.svg" alt="bosch" />
          <img src="img/go.svg" alt="go" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </body>
</html>
